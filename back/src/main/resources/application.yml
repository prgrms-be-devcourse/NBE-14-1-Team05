spring:
  application:
    name: myapp

  datasource:
    url: jdbc:h2:~/local
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

admin:
  code: ${ADMIN_CODE}
#  프론트에서 설정한 .env 파일의 admin 코드 번호

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}